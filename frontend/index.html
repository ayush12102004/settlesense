<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SettleSense — AI Finance Controller</title>
  <meta name="description" content="Multi-source payment reconciliation and Settlement Q&A Agent for Razorpay merchants.">
  
  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#FAFAF9',
            surface: '#FFFFFF',
            ink: '#1C1C1E',
            'ink-muted': '#6E6E73',
            hairline: '#E5E5E7',

            matched: '#1F8A5F',
            exception: '#C4462B',

          fontFamily: {

            drawer: '0 1px 2px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.03)',

  </script>

  <!-- React 18, ReactDOM, PropTypes, Recharts, Marked for Markdown, and Babel Standalone -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js"></script>

  <style>
    body {
      background-color: #FAFAF9;
      color: #1C1C1E;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;

    .markdown-body h4 { font-weight: 600; margin-top: 0.5rem; margin-bottom: 0.25rem; font-size: 0.875rem; }

    .markdown-body ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.5rem; }
    .markdown-body ol { list-style-type: decimal; padding-left: 1.25rem; margin-bottom: 0.5rem; }
    .markdown-body code { background: #f4f4f5; padding: 0.1rem 0.3rem; border-radius: 3px; font-family: monospace; font-size: 0.85em; }
    .markdown-body pre { background: #18181b; color: #f4f4f5; padding: 0.75rem; border-radius: 6px; overflow-x: auto; margin-bottom: 0.75rem; font-size: 0.85em; }
    .markdown-body hr { border: none; border-top: 1px solid #E5E5E7; margin: 0.75rem 0; }
    .markdown-body strong { font-weight: 600; }
    .markdown-body em { font-style: italic; }
    .markdown-body blockquote { border-left: 3px solid #3A5DFF; padding-left: 0.75rem; margin: 0.5rem 0; color: #6E6E73; font-style: italic; }
    .markdown-body table { width: 100%; border-collapse: collapse; margin: 0.5rem 0; font-size: 0.8rem; table-layout: auto; }
    .markdown-body thead { background: #F5F5F4; }
    .markdown-body th { text-align: left; padding: 0.4rem 0.5rem; font-weight: 600; color: #1C1C1E; border-bottom: 2px solid #E5E5E7; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.02em; }
    .markdown-body td { padding: 0.35rem 0.5rem; border-bottom: 1px solid #E5E5E7; color: #1C1C1E; vertical-align: top; overflow-wrap: break-word; }
    .markdown-body tr:last-child td { border-bottom: none; }
    .markdown-body tr:hover { background: #FAFAF9; }
    .markdown-body .table-wrap { overflow-x: auto; max-width: 100%; }
  </style>

<body class="min-h-screen bg-[#FAFAF9] text-[#1C1C1E]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { LineChart, Line, XAxis, YAxis, Tooltip, ResponsiveContainer, CartesianGrid } = Recharts;

    // --- Formatting Utilities ----------------------------------------------------

    function formatCurrency(amount) {
      if (amount == null) return '—';
      const abs = Math.abs(amount);
      const formatted = abs.toLocaleString('en-IN', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      });
      const sign = amount < 0 ? '-' : '';
      return `${sign}\u20B9${formatted}`;
    }

    function formatCompact(n) {
      if (n == null) return '—';
      if (n >= 100000) return `₹${(n / 100000).toFixed(1)}L`;
      if (n >= 1000) return `₹${(n / 1000).toFixed(0)}K`;
      return formatCurrency(n);
    }

    function formatPercent(value) {
      if (value == null) return '—';
      return `${(value * 100).toFixed(1)}%`;
    }

    function formatReasonCode(code) {
      const labels = {
        NO_CANDIDATE_IN_WINDOW: 'No candidate in window',
        AMOUNT_MISMATCH_BEYOND_TOLERANCE: 'Amount mismatch',
        SPLIT_SETTLEMENT_UNRESOLVED: 'Split settlement unresolved',
        DUPLICATE_CANDIDATES_AMBIGUOUS: 'Duplicate candidates',
        PENDING_NOT_YET_SETTLED: 'Pending settlement',
        LOW_CONFIDENCE_LLM_MATCH: 'Low confidence AI match',
      };
      return labels[code] || code;
    }

    // --- Lucide Minimal SVG Icons ------------------------------------------------

    const SparklesIcon = () => (
      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
      </svg>
    );

    const DownloadIcon = () => (
      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="7 10 12 15 17 10" />
        <line x1="12" y1="15" x2="12" y2="3" />
      </svg>
    );

    const ChevronRightIcon = () => (
      <svg className="w-4 h-4 text-[#6E6E73]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
        <polyline points="9 18 15 12 9 6" />
      </svg>
    );

    const CloseIcon = () => (
      <svg className="w-5 h-5 text-[#6E6E73] hover:text-[#1C1C1E]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    );

    const SendIcon = () => (
      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
        <line x1="22" y1="2" x2="11" y2="13" />
        <polygon points="22 2 15 22 11 13 2 9 22 2" />
      </svg>
    );

    const CopyIcon = () => (
      <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
        <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
      </svg>
    );

    const CheckIcon = () => (
      <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
        <polyline points="20 6 9 17 4 12" />
      </svg>
    );

    const SearchIcon = () => (
      <svg className="w-3.5 h-3.5 text-[#6E6E73]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
    );

    // --- Main Application Component ----------------------------------------------

    function SettleSenseApp() {
      const [data, setData] = useState(null);
      const [taxData, setTaxData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [selectedTraceId, setSelectedTraceId] = useState(null);
      
      // Exception filtering & resolve state
      const [exceptionFilter, setExceptionFilter] = useState('all'); // 'all', 'exceptions', 'pending', 'resolved'
      const [searchQuery, setSearchQuery] = useState('');
      const [resolvedTraces, setResolvedTraces] = useState(new Set());

      function toggleResolveTrace(traceId) {
        setResolvedTraces(prev => {
          const next = new Set(prev);
          if (next.has(traceId)) next.delete(traceId);
          else next.add(traceId);
          return next;
        });
      }
      
      // Cash Stress Simulation State
      const [simulatingLag, setSimulatingLag] = useState(false);
      const [activeLagDays, setActiveLagDays] = useState(0);
      const [simulatedCash, setSimulatedCash] = useState(null);

      // Q&A Agent Chat State
      const [chatOpen, setChatOpen] = useState(false);
      const [chatInput, setChatInput] = useState('');
      const [chatHistory, setChatHistory] = useState([
        {
          role: 'assistant',
          content: 'Hello! I am your **SettleSense AI Finance Controller**. I have live grounding over this cycle\'s bank statements, Razorpay gateway settlements, merchant ledger, and GSTR-2B tax compliance. You can ask me to explain any exception, analyze split settlements, forecast cash flow, or draft dispute emails.'
        }
      ]);
      const [chatLoading, setChatLoading] = useState(false);

      // Deep Diagnosis State
      const [diagnosing, setDiagnosing] = useState(false);
      const [diagnosisResult, setDiagnosisResult] = useState(null);
      const [copiedDraft, setCopiedDraft] = useState(false);

      const closeBtnRef = useRef(null);
      const chatEndRef = useRef(null);

      useEffect(() => {
        async function fetchData() {
          try {
            const [dashResp, taxResp] = await Promise.all([
              fetch('/api/dashboard'),
              fetch('/api/tax-reconciliation'),
            ]);
            if (!dashResp.ok) throw new Error(`Dashboard HTTP ${dashResp.status}`);
            const json = await dashResp.json();
            setData(json);

            if (taxResp.ok) {
              const taxJson = await taxResp.json();
              setTaxData(taxJson);
            }
          } catch (err) {
            setError(`Failed to load data: ${err.message}. Please ensure the server is running.`);
          } finally {
            setLoading(false);
          }
        }
        fetchData();
      }, []);

      useEffect(() => {
        function handleKeyDown(e) {
          if (e.key === 'Escape') {
            if (chatOpen) setChatOpen(false);
            else if (selectedTraceId) setSelectedTraceId(null);
          }
        }
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [selectedTraceId, chatOpen]);

      useEffect(() => {
        if (selectedTraceId) {
          setDiagnosisResult(null);
          setCopiedDraft(false);
          if (closeBtnRef.current) closeBtnRef.current.focus();
        }
      }, [selectedTraceId]);

      useEffect(() => {
        if (chatOpen && chatEndRef.current) {
          chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [chatHistory, chatOpen]);

      // Cash Simulation Handler
      async function handleLagSimulation(lagDays) {
        if (simulatingLag) return;
        setSimulatingLag(true);
        try {
          const resp = await fetch('/api/cash-position/simulate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ lag_days: lagDays })
          });
          if (resp.ok) {
            const resJson = await resp.json();
            setSimulatedCash(resJson);
            setActiveLagDays(lagDays);
          }
        } catch (err) {
          console.error("Simulation failed:", err);
        } finally {
          setSimulatingLag(false);
        }
      }

      // Handle Q&A Message Send
      async function handleSendMessage(msgToSend) {
        const text = msgToSend || chatInput;
        if (!text.trim() || chatLoading) return;

        const newHistory = [...chatHistory, { role: 'user', content: text }];
        setChatHistory(newHistory);
        setChatInput('');
        setChatLoading(true);

        try {
          const resp = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text, history: newHistory }),
          });
          const result = await resp.json();
          setChatHistory([...newHistory, { role: 'assistant', content: result.response }]);
        } catch (err) {
          setChatHistory([...newHistory, { role: 'assistant', content: `Error: Failed to reach AI Controller (${err.message}).` }]);
        } finally {
          setChatLoading(false);
        }
      }

      // Handle AI Deep Diagnosis on Exception
      async function runDiagnosis(traceId) {
        setDiagnosing(true);
        try {
          const resp = await fetch('/api/agent/diagnose', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ trace_id: traceId }),
          });
          const result = await resp.json();
          setDiagnosisResult(result.diagnosis);
        } catch (err) {
          setDiagnosisResult(`Failed to run diagnosis: ${err.message}`);
        } finally {
          setDiagnosing(false);
        }
      }

      function copyText(text) {
        navigator.clipboard.writeText(text);
        setCopiedDraft(true);
        setTimeout(() => setCopiedDraft(false), 2500);
      }

      if (loading) {
        return (
          <div className="flex items-center justify-center min-h-[60vh] text-[#6E6E73] text-[15px]">
            Loading reconciliation data…
          </div>
        );
      }

      if (error) {
        return (
          <div className="max-w-[1120px] mx-auto px-6 py-12 text-[#C4462B] text-[15px]">
            {error}
          </div>
        );
      }

      const summary = data?.summary || {};
      const cash = simulatedCash || data?.cash_position || {};
      const exceptions = data?.exceptions || [];
      const auditTrail = data?.audit_trail || [];
      const metrics = data?.metrics || {};
      const modelInfo = data?.model_info || { model_name: 'offline mock', is_mock: true };

      const matchedCount = summary.total_matched || 0;
      const totalEligible = (summary.total_records || 0) - (summary.pending_count || 0);
      const layers = summary.by_layer || {};
      const exceptionCount = (summary.total_exceptions || 0) - (summary.pending_count || 0);
      const pendingCount = summary.pending_count || 0;

      // Group exceptions: real exceptions first, then pending
      const realExceptions = exceptions.filter(e => e.reason_code !== 'PENDING_NOT_YET_SETTLED');
      const pendingExceptions = exceptions.filter(e => e.reason_code === 'PENDING_NOT_YET_SETTLED');
      const sortedExceptions = [...realExceptions, ...pendingExceptions];

      // Filtered exceptions based on filter tab and search query
      const filteredExceptions = sortedExceptions.filter(exc => {
        const isPending = exc.reason_code === 'PENDING_NOT_YET_SETTLED';
        const isResolved = resolvedTraces.has(exc.trace_id);
        
        if (exceptionFilter === 'exceptions' && isPending) return false;
        if (exceptionFilter === 'pending' && !isPending) return false;
        if (exceptionFilter === 'resolved' && !isResolved) return false;
        if (exceptionFilter !== 'resolved' && isResolved && exceptionFilter !== 'all') return false;

        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          const orderRef = (exc.gateway_order_ids || []).concat(exc.ledger_order_ids || []).join(' ').toLowerCase();
          const payRef = (exc.gateway_payment_ids || []).join(' ').toLowerCase();
          const reason = (exc.reason || '').toLowerCase();
          const code = (exc.reason_code || '').toLowerCase();
          const utr = (exc.bank_utr || '').toLowerCase();
          return orderRef.includes(q) || payRef.includes(q) || reason.includes(q) || code.includes(q) || utr.includes(q);
        }
        return true;
      });

      const selectedAudit = selectedTraceId
        ? auditTrail.find(r => r.trace_id === selectedTraceId)
        : null;

      const dailyProjection = cash.daily_projection || [];

      // Custom Tooltip for Recharts
      const CustomTooltip = ({ active, payload }) => {
        if (active && payload && payload.length) {
          const item = payload[0].payload;
          return (
            <div className="bg-white border border-[#E5E5E7] p-3 rounded shadow-sm text-xs space-y-1">
              <div className="font-semibold text-[#1C1C1E]">{item.day_label} ({item.date})</div>
              <div className="text-[#6E6E73]">
                Cumulative: <span className="tabular font-medium text-[#1C1C1E]">{formatCurrency(item.cumulative_position)}</span>
              </div>
              <div className="text-[#6E6E73]">
                Expected Inflow: <span className="tabular font-medium text-[#1C1C1E]">{formatCurrency(item.expected_inflow)}</span>
              </div>
              <div className="text-[11px] text-[#6E6E73] italic">
                {item.is_projected ? 'Projected settlement' : 'Reconciled position'}
              </div>
            </div>
          );
        }
        return null;
      };

      return (
        <div className="max-w-[1120px] mx-auto px-6 sm:px-8 py-8">
          {/* Header */}
          <header className="flex flex-wrap items-center justify-between gap-4 pb-6 border-b border-[#E5E5E7] mb-10">
            <div className="flex items-center gap-3">
              <h1 className="text-xl font-semibold text-[#1C1C1E]">SettleSense</h1>
              
              {/* Dynamic Model Status Indicator */}
              {modelInfo.is_mock ? (
                <span className="inline-flex items-center gap-1.5 text-xs text-[#6E6E73] bg-[#FAFAF9] px-2.5 py-1 rounded-full border border-[#E5E5E7]">
                  <span className="w-1.5 h-1.5 rounded-full bg-[#6E6E73]"></span>
                  {modelInfo.model_name}
                </span>
              ) : modelInfo.provider === 'groq' ? (
                <span className="inline-flex items-center gap-1.5 text-xs text-[#F55036] bg-[#FFF5F2] px-2.5 py-1 rounded-full border border-[#FFD9D0] font-medium">
                  <span className="w-1.5 h-1.5 rounded-full bg-[#F55036] animate-pulse"></span>
                  {modelInfo.model_name} (Groq LPU)
                </span>
              ) : (
                <span className="inline-flex items-center gap-1.5 text-xs text-[#1F8A5F] bg-[#ECFDF3] px-2.5 py-1 rounded-full border border-[#A6F4C5] font-medium">
                  <span className="w-1.5 h-1.5 rounded-full bg-[#1F8A5F] animate-pulse"></span>
                  {modelInfo.model_name} (Live AI)
                </span>
              )}
            </div>

            <div className="flex items-center gap-3">
              {/* Settlement Q&A Agent Toggle Button */}
              <button
                onClick={() => setChatOpen(true)}
                className="inline-flex items-center gap-2 px-3.5 py-2 text-sm font-medium rounded-md bg-[#3A5DFF] hover:bg-[#2B4BF2] text-white shadow-sm focus-visible:outline-2 focus-visible:outline-[#3A5DFF] transition-all"
                title="Open Interactive Settlement Q&A Agent"
              >
                <SparklesIcon />
                <span>Ask Finance Agent</span>
              </button>

              {/* Dual JSON & CSV Export Group */}
              <div className="inline-flex rounded-md shadow-sm border border-[#E5E5E7] bg-white overflow-hidden">
                <a
                  href="/api/audit/export?format=json"
                  target="_blank"
                  rel="noopener noreferrer"
                  className="inline-flex items-center gap-1.5 px-3 py-2 text-xs font-medium hover:bg-[#F5F5F4] text-[#1C1C1E] border-r border-[#E5E5E7] transition-colors"
                  title="Export audit trail as JSON"
                >
                  <DownloadIcon />
                  <span>JSON</span>
                </a>
                <a
                  href="/api/audit/export?format=csv"
                  download="audit_trail.csv"
                  className="inline-flex items-center gap-1.5 px-3 py-2 text-xs font-medium hover:bg-[#F5F5F4] text-[#1C1C1E] transition-colors"
                  title="Export audit trail as CSV"
                >
                  <DownloadIcon />
                  <span>CSV</span>
                </a>
              </div>
            </div>
          </header>

          {/* Zone 1: Hero Metric Block */}
          <section className="mb-12" aria-labelledby="hero-title">
            <h2 id="hero-title" className="sr-only">Reconciliation Summary</h2>
            <div className="text-5xl sm:text-6xl font-semibold tabular tracking-tight text-[#3A5DFF]">
              {formatPercent(summary.match_rate)}
            </div>
            <div className="text-[15px] text-[#6E6E73] mt-1">
              {matchedCount} of {totalEligible} records reconciled automatically
            </div>

            {/* Layer breakdown row */}
            <div className="flex flex-wrap items-center gap-6 sm:gap-8 mt-5 pt-1">
              <div className="flex items-center gap-2 text-[15px]">
                <span className="w-2 h-2 rounded-full bg-[#1F8A5F] shrink-0"></span>
                <span className="font-semibold tabular text-[#1C1C1E]">{layers.exact || 0}</span>
                <span className="text-[#6E6E73]">exact</span>
              </div>
              <div className="flex items-center gap-2 text-[15px]">
                <span className="w-2 h-2 rounded-full bg-[#3A5DFF] shrink-0"></span>
                <span className="font-semibold tabular text-[#1C1C1E]">{layers.tolerant || 0}</span>
                <span className="text-[#6E6E73]">tolerant</span>
              </div>
              <div className="flex items-center gap-2 text-[15px]">
                <span className="w-2 h-2 rounded-full bg-[#7C5CFC] shrink-0"></span>
                <span className="font-semibold tabular text-[#1C1C1E]">{layers.llm_assisted || 0}</span>
                <span className="text-[#6E6E73]">AI-assisted</span>
              </div>
              {exceptionCount > 0 && (
                <div className="flex items-center gap-2 text-[15px]">
                  <span className="w-2 h-2 rounded-full bg-[#C4462B] shrink-0"></span>
                  <span className="font-semibold tabular text-[#1C1C1E]">{exceptionCount}</span>
                  <span className="text-[#6E6E73]">exceptions</span>
                </div>
              )}
              {pendingCount > 0 && (
                <div className="flex items-center gap-2 text-[15px]">
                  <span className="w-2 h-2 rounded-full bg-[#B07D2F] shrink-0"></span>
                  <span className="font-semibold tabular text-[#1C1C1E]">{pendingCount}</span>
                  <span className="text-[#6E6E73]">pending</span>
                </div>
              )}
            </div>

            {/* Financial Rupee Metrics for Finance Controllers */}
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-6">
              <div className="p-4 rounded-lg bg-white border border-[#E5E5E7] shadow-xs">
                <div className="text-xs text-[#6E6E73] mb-1 font-medium">Reconciled Cash Inflow</div>

                          {selectedAudit.gateway_net_amounts?.map(a => formatCurrency(a)).join(', ') || '—'}
                        </span>
                      </div>
                      {selectedAudit.gateway_total_net != null && (
                        <div className="flex py-2">
                          <span className="w-36 text-[13px] text-[#6E6E73] shrink-0">Total net</span>
                          <span className="tabular font-medium text-[#1C1C1E]">{formatCurrency(selectedAudit.gateway_total_net)}</span>
                        </div>
                      )}
                    </div>
                  </div>

                  {/* Internal Ledger */}
                  <div>
                    <h3 className="text-[13px] font-medium text-[#6E6E73] mb-2">Internal ledger</h3>
                    <div className="divide-y divide-[#E5E5E7]">
                      <div className="flex py-2">
                        <span className="w-36 text-[13px] text-[#6E6E73] shrink-0">Order ID(s)</span>
                        <span className="font-mono text-xs text-[#1C1C1E] break-all">
                          {selectedAudit.ledger_order_ids?.join(', ') || '—'}
                        </span>
                      </div>
                      <div className="flex py-2">
                        <span className="w-36 text-[13px] text-[#6E6E73] shrink-0">Expected amount(s)</span>
                        <span className="tabular text-[#1C1C1E]">
                          {selectedAudit.ledger_expected_amounts?.map(a => formatCurrency(a)).join(', ') || '—'}
                        </span>
                      </div>
                    </div>
                  </div>

                  {/* Verification */}
                  {selectedAudit.amount_diff != null && (
                    <div>
                      <h3 className="text-[13px] font-medium text-[#6E6E73] mb-2">Verification</h3>
                      <div className="divide-y divide-[#E5E5E7]">
                        <div className="flex py-2">
                          <span className="w-36 text-[13px] text-[#6E6E73] shrink-0">Amount difference</span>
                          <span className="tabular font-medium text-[#1C1C1E]">{formatCurrency(selectedAudit.amount_diff)}</span>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* Metadata */}
                  <div>
                    <h3 className="text-[13px] font-medium text-[#6E6E73] mb-2">Metadata</h3>
                    <div className="divide-y divide-[#E5E5E7]">
                      <div className="flex py-2">
                        <span className="w-36 text-[13px] text-[#6E6E73] shrink-0">Timestamp</span>
                        <span className="text-[#1C1C1E]">{selectedAudit.timestamp || '—'}</span>
                      </div>
                      {selectedAudit.reason_code && (
                        <div className="flex py-2">
                          <span className="w-36 text-[13px] text-[#6E6E73] shrink-0">Reason code</span>
                          <span className="font-mono text-xs text-[#1C1C1E]">{selectedAudit.reason_code}</span>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              </aside>
            </>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<SettleSenseApp />);
  </script>
</body>
</html>
